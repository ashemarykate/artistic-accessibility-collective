    background:transparent;
    min-height:100vh;padding:18px 8px 26px;
    display:flex;
  }
  /* The desktop. Both layers live on <html> with background-attachment:fixed
     rather than on a position:fixed pseudo element. A fixed pseudo element has
     to be sized against the viewport, and some renderers get that wrong after
     a resize, leaving the wallpaper stranded in a corner. A background on the
     root has no box to get wrong.

     Order matters: the vignette is listed first so it paints on top of the
     collage, and the flat colour last so it shows while the image loads. */
  html{
    background-image:
      radial-gradient(ellipse 70% 55% at 50% 42%,
        rgba(8,18,38,.10) 0%, rgba(8,18,38,.34) 55%, rgba(6,14,30,.62) 100%),
      url(/2006/bg.jpg);
    background-repeat:no-repeat, no-repeat;
    background-position:center center, center center;
    background-size:cover, cover;
    background-attachment:fixed, fixed;
    background-color:var(--desktop);
  }

  /* The window is drawn at a phone's width on purpose: every size inside it is
     tuned for 300px. Rather than reflow it for a laptop, which would stop it
     being a buddy list, the whole thing is zoomed. Proportions stay exactly as
     designed and the pixel type grows with everything else.

     zoom, not transform: scale, because zoom takes part in layout, so centring
     and page height still work. A browser without zoom gets the 300px version,
     which is simply the phone layout. */
  :root{ --pod-zoom:1 }

  /* Height is the real constraint, not width. The sign on window is 469px tall
     at 1x, so a zoom picked from width alone makes a laptop scroll for two
     screens to reach the buttons, which is why the phone felt better: there
     the window simply fits. Every step below asks for the height to be there
     too, so the window grows only when there is room to see it whole. */
  @media (min-width:  640px) and (min-height: 620px) { :root{ --pod-zoom:1.3 } }
  @media (min-width:  860px) and (min-height: 760px) { :root{ --pod-zoom:1.6 } }
  @media (min-width: 1150px) and (min-height: 900px) { :root{ --pod-zoom:1.9 } }
  @media (min-width: 1500px) and (min-height:1040px) { :root{ --pod-zoom:2.2 } }
  @media (min-width:  640px) { body{ padding:12px 8px 18px } }

  .frame{width:100%;max-width:300px;margin:auto;zoom:var(--pod-zoom)}

  /* The IM and profile windows live outside .frame, so they need the same
     zoom or a popup opens tiny in the middle of a big page. */
  .popwin{zoom:var(--pod-zoom)}
  img.i{image-rendering:pixelated;vertical-align:middle}

  /* ══════════ focus ══════════
     Every interactive thing had no focus style at all, so tabbing through was
     invisible. A yellow ring with a dark outer edge so it survives both the
     pale window chrome and the black panes. */
  :where(a, button, input, select, textarea, [tabindex]):focus-visible{
    outline:3px solid #ffd652;
    outline-offset:1px;
    box-shadow:0 0 0 5px rgba(0,0,0,.75);
    border-radius:2px;
  }
  /* Keyboard users only. A mouse click should not leave a ring behind. */
  :where(a, button, input, select, textarea):focus:not(:focus-visible){ outline:none }

  /* ══════════ screen reader only ══════════ */
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }


  /* ══════════ iPod (home) ══════════ */
  .ipod{
    width:240px;margin:0 auto;padding:13px 13px 16px;
    background:linear-gradient(165deg,#fefefe 0%,#f2f2f4 45%,#dedee2 100%);
    border-radius:20px;border:1px solid #b9b9c0;
    box-shadow:0 14px 34px rgba(0,0,0,.6), 0 3px 10px rgba(0,0,0,.4), inset 0 1px 0 #fff;
  }
  .pod-screen{
    background:#fff;border:2px solid #4a4a50;border-radius:2px;
    box-shadow:inset 0 0 0 1px #9a9aa2;overflow:hidden;
  }
  .pod-bar{
    background:linear-gradient(180deg,#9fb7d8,#5d7ea9 55%,#4a6b96);
    color:#fff;font-size:10px;font-weight:bold;padding:2px 5px;
    display:flex;align-items:center;justify-content:space-between;
    text-shadow:0 1px 1px rgba(0,0,0,.4);
  }
  .pod-batt{width:15px;height:8px;border:1px solid #fff;border-radius:1px;position:relative}
  .pod-batt::after{content:"";position:absolute;inset:1px;right:4px;background:#9be36b}
  .pod-menu{list-style:none;margin:0;padding:0;background:#fff;min-height:150px}
  .pod-menu li{border-bottom:1px solid #eceef2}
  .pod-menu button{
    width:100%;display:flex;align-items:center;gap:6px;
    background:none;border:0;font-family:inherit;font-size:12.5px;color:#111;
    padding:6px 6px 6px 8px;text-align:left;cursor:pointer;
  }
  .pod-menu button .chev{margin-left:auto;color:#7a8699;font-size:12px}
  .pod-menu li.on button{
    background:linear-gradient(180deg,#7ea8dc,#3f6ea8 60%,#35608f);color:#fff;
    text-shadow:0 1px 1px rgba(0,0,0,.35);
  }
  .pod-menu li.on button .chev{color:#fff}
  .pod-note{
    background:#f4f5f8;border-top:1px solid #dfe2ea;
    font-size:9px;color:#6a7385;padding:3px 6px;text-align:center;
  }
  .wheel{
    width:150px;height:150px;margin:15px auto 0;border-radius:50%;
    background:radial-gradient(circle at 50% 32%,#f7f7f9,#e2e2e6 62%,#cfcfd6);
    border:1px solid #c2c2ca;position:relative;
    box-shadow:inset 0 1px 2px #fff, 0 1px 3px rgba(0,0,0,.18);
  }
  .wheel .lbl{
    position:absolute;font-size:9.5px;color:#8b8b95;font-weight:bold;letter-spacing:.5px;
    background:none;border:0;font-family:inherit;cursor:pointer;padding:3px 6px;
  }
  .wheel .lbl:active{color:#555}
  .wheel .w-menu{top:7px;left:50%;transform:translateX(-50%)}
  .wheel .w-prev{left:8px;top:50%;transform:translateY(-50%);font-size:11px}
  .wheel .w-next{right:8px;top:50%;transform:translateY(-50%);font-size:11px}
  .wheel .w-play{bottom:7px;left:50%;transform:translateX(-50%);font-size:11px}
  .wheel .center{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:58px;height:58px;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 50% 35%,#fbfbfc,#e6e6ea 70%,#d4d4da);
    border:1px solid #c2c2ca;box-shadow:inset 0 1px 2px #fff,0 1px 2px rgba(0,0,0,.15);
  }
  .wheel .center:active{background:radial-gradient(circle at 50% 35%,#e8e8ec,#d6d6dc)}
  .pod-caption{
    text-align:center;color:#fff;font-size:10px;margin:14px auto 0;line-height:1.5;
    background:rgba(6,14,30,.66);border:1px solid rgba(255,255,255,.18);
    padding:5px 12px;border-radius:2px;max-width:240px;
    text-shadow:0 1px 2px rgba(0,0,0,.8);backdrop-filter:blur(3px);
  }

  /* ══════════ XP window ══════════ */
  .win{
    background:var(--chrome);border:1px solid #003c74;
    border-radius:8px 8px 0 0;overflow:hidden;
    box-shadow:2px 4px 0 rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.5);
  }
  .titlebar{
    background:linear-gradient(180deg,#5da1f0 0%,#2472d8 8%,var(--xp-blue1) 42%,#0a51cc 90%,#1c66d8 100%);
    color:#fff;font-weight:bold;font-size:13px;padding:5px 6px;
    display:flex;align-items:center;gap:5px;
    text-shadow:1px 1px 1px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;
  }
  .tb-btns{margin-left:auto;display:flex;gap:2px;flex:none}
  .tb-btn{
    width:21px;height:20px;border-radius:3px;
    background:linear-gradient(180deg,#7ba7ee,#2b63c8);
    border:1px solid #fff;color:#fff;font-size:11px;line-height:18px;text-align:center;
    font-weight:bold;font-family:inherit;padding:0;cursor:pointer;
  }
  .tb-btn.x{background:linear-gradient(180deg,#eb9f8c,#ce3c14)}
  .menubar{display:flex;gap:2px;background:var(--chrome);font-size:11px;padding:2px 4px;border-bottom:1px solid #d8d4c4}
  .menubar button{background:none;border:0;font-family:inherit;font-size:11px;padding:2px 7px;cursor:pointer}
  .menubar button:active{background:var(--sel);color:#fff}

  /* ══════════ SIGN ON (landing) ══════════ */
  .so-body{padding:8px 9px 10px}
  .so-art{
    background:#000;border:1px solid #6f6f6f;
    box-shadow:inset 1px 1px 0 #3a3a3a;
    position:relative;overflow:hidden;line-height:0;
  }
  .so-art img{display:block;width:100%;height:auto}
  .so-art::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);
  }
  .so-rule{height:1px;background:var(--chrome-dk);border-bottom:1px solid #fff;margin:10px 1px}
  .so-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .so-row label{font-size:12px;color:#000;flex:none;width:78px}
  .so-input{
    flex:1;display:flex;border:1px solid #808080;
    box-shadow:inset 1px 1px 0 #4a4a4a;background:#fff;
  }
  .so-input input{
    flex:1;min-width:0;font-family:inherit;font-size:12.5px;
    padding:3px 4px;border:0;background:none;outline:none;
  }
  .so-input .drop{
    width:17px;flex:none;background:linear-gradient(180deg,#fff,var(--chrome));
    border-left:1px solid #808080;font-size:8px;color:#333;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .so-joke{display:inline-block;margin-top:3px;font-style:italic;color:#6b6b60}
  .so-hint{
    font-size:10px;color:#5a5a52;margin:6px 2px 7px;line-height:1.35;text-align:center;
  }
  .so-anon{
    width:100%;font-family:inherit;font-size:12px;padding:6px 8px;cursor:pointer;
    background:linear-gradient(180deg,#fff,var(--chrome));
    border:1px solid #003c74;border-radius:3px;color:#333;
  }
  .so-anon:active{background:#ddd9c8}
  .so-checks{display:flex;justify-content:space-between;gap:8px;margin:9px 2px 4px;color:#9a9a92;font-size:10.5px}
  .so-checks span{display:flex;align-items:center;gap:4px}
  .so-checks i{width:11px;height:11px;border:1px solid #9a9a92;background:#e6e3d8;display:inline-block}
  .so-foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px}
  .so-btn{
    background:none;border:0;font-family:inherit;font-size:10px;color:#333;
    cursor:pointer;text-align:center;padding:2px 4px;line-height:1.3;
  }
  .so-btn .bi{display:block;font-size:16px;margin-bottom:1px}
  .so-btn.go{font-weight:bold;font-size:11.5px;color:#0a5a1e}
  .so-btn.go img{width:22px;height:22px;display:block;margin:0 auto 1px}
  .so-ver{text-align:center;font-size:9.5px;color:#777;margin-top:7px}

  /* ══════════ buddy list ══════════ */
  .bl-head{
    display:flex;align-items:center;gap:8px;padding:6px 8px;
    background:linear-gradient(180deg,#fff,var(--chrome));border-bottom:1px solid var(--chrome-dk);
  }
  .bl-head img{width:28px;height:28px;flex:none}
  .bl-head .me{font-size:13px;font-weight:bold;color:#1a3d6e}
  .bl-head .mail{font-size:10px;color:#555}
  .pane{background:#fff;border:1px solid var(--chrome-dk);margin:6px;min-height:200px;padding:2px 0 6px}
  .pane.dark{background:#141414;border-color:#000;padding:0}
  .grp{
    display:flex;align-items:center;gap:4px;width:100%;background:none;border:0;
    text-align:left;cursor:pointer;font-family:inherit;
    font-size:12px;font-weight:bold;color:#000;padding:4px 6px 2px;
  }
  .grp .tri{font-size:9px;width:10px;color:#333}
  .grp .cnt{font-weight:normal;color:#666}
  .grp.off-grp{color:#888}
  .buddy{
    display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;
    cursor:pointer;text-align:left;font-family:inherit;
    font-size:12.5px;padding:3px 6px 3px 16px;color:#000;
  }
  .buddy.sel{background:var(--sel)}
  .buddy.sel .sn{color:#fff}
  .buddy img.i{width:16px;height:16px;flex:none}
  .buddy.away .sn{color:#7d7d7d;font-style:italic}
  .buddy.offline .sn{color:#a0a0a0}
  .idle{margin-left:auto;font-size:11px;color:#888;padding-right:4px}
  .buddy.sel .idle{color:#dce8f8}
  .collapsed .buddy{display:none}

  .pane-pad{padding:10px}
  .pane h2{font-size:13px;margin:0 0 6px;color:#1a3d6e}
  .pane p{font-size:11.5px;line-height:1.5;margin:0 0 8px;color:#333}
  .kv{font-size:11.5px;line-height:1.75}
  .kv b{color:#1a3d6e}

  /* ══════════ 2006 LIVE — a bad blog ══════════ */
  .blog{
    background:#000;padding:10px 11px 12px;
    font-family:"Times New Roman",Times,serif;color:#d6d6d6;
  }
  .blog hr{border:0;border-top:1px solid #2a2a2a;margin:11px 0}
  .blog .blog-h{
    font-family:"Times New Roman",serif;font-size:21px;margin:0;
    letter-spacing:-.5px;color:#fff;
  }
  .blog .blog-p{font-size:12.5px;line-height:1.45;margin:5px 0 0;color:#9a9a9a}
  .blog-cat{
    font-family:"W95FA",Tahoma,sans-serif;font-size:11px;font-weight:bold;
    letter-spacing:1.5px;text-transform:uppercase;
    margin:0 0 5px;padding:3px 6px;display:inline-block;
    background:var(--neon);color:#000;
    box-shadow:0 0 10px color-mix(in srgb, var(--neon) 60%, transparent);
  }
  .blog-list{list-style:none;margin:0;padding:0 0 0 2px}
  .blog-list li{margin:0 0 5px;font-size:13.5px;line-height:1.35}
  .blog-list li::before{content:"» ";color:#555}
  .blog-link{
    color:var(--neon);text-decoration:underline;
    text-shadow:0 0 5px color-mix(in srgb, var(--neon) 55%, transparent);
  }
  .blog-link:visited{filter:saturate(.55) brightness(.85)}
  .blog-link:hover{background:var(--neon);color:#000;text-shadow:none}
  .blog-todo{color:#5e5e5e;font-style:italic;font-size:12.5px}
  .blog .blog-sig{
    font-family:"W95FA",Tahoma,sans-serif;font-size:9px;color:#8a8a8a;
    text-align:center;margin:9px 0 0;
  }

  /* ══════════ PLAY — the arcade ══════════
     Same dark skin as Videos, because they are siblings: a hand collected list
     of links out. Each row is one big target carrying the year, who made it
     and a line about what it is, so you know what you are opening. */
  .gm-list{list-style:none;margin:0;padding:0}
  .gm-list li{margin:0 0 8px}
  .gm-a{
    display:block;padding:7px 8px;text-decoration:none;
    background:#0a0a0a;border:1px solid #262626;
  }
  .gm-a:hover,.gm-a:focus-visible{background:#141414;border-color:var(--neon)}
  .gm-t{
    font-family:"W95FA",Tahoma,sans-serif;font-size:12.5px;
    color:var(--neon);text-decoration:underline;
    text-shadow:0 0 5px color-mix(in srgb, var(--neon) 55%, transparent);
  }
  .gm-meta{
    font-family:"W95FA",Tahoma,sans-serif;font-size:9px;color:#7d7d7d;
    display:block;margin-top:3px;letter-spacing:.3px;
  }
  .gm-n{display:block;font-size:12.5px;line-height:1.4;color:#9a9a9a;margin-top:4px}

  /* ══════════ THE COUNTDOWN — the practice ballot ══════════
     Note the doubled selectors: .pane p beats a single class, so anything
     landing on a <p> in here has to be written .blog .ct-x or it inherits dark
     grey text on a black pane and vanishes. The file already learned this the
     hard way with .blog .blog-p.
     --neon gets a default here because it is otherwise only ever set inline,
     and anything that loses it renders black on black. */
  .blog{--neon:#39ff14}
  .ct-set{border:0;margin:0;padding:0;min-width:0}
  .blog .ct-legend{
    font-size:12.5px;line-height:1.45;color:#9a9a9a;padding:0;margin:0 0 10px;
  }
  .ct-row{
    display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:8px;
    background:#0a0a0a;border:1px solid #262626;padding:7px 8px;margin:0 0 8px;
  }
  .ct-row.on{border-color:var(--neon)}
  /* The Win98 sunken bevel off the sign on box, milled round. Never hidden:
     it has to keep its place in the tab order and its focus ring. */
  .ct-radio{
    appearance:none;-webkit-appearance:none;flex:none;margin:3px 0 0;
    width:13px;height:13px;border-radius:50%;cursor:pointer;
    background:#fff;border:1px solid #808080;box-shadow:inset 1px 1px 0 #4a4a4a;
  }
  .ct-radio:checked{background:radial-gradient(circle,#111 0 42%,#fff 44%)}
  .ct-label{flex:1;min-width:0;cursor:pointer;display:block}
  .ct-t{display:block;font-family:"W95FA",Tahoma,sans-serif;font-size:12.5px;color:#fff}
  .ct-row.on .ct-t{
    color:var(--neon);text-shadow:0 0 5px color-mix(in srgb, var(--neon) 55%, transparent);
  }
  .ct-a{
    display:block;font-family:"W95FA",Tahoma,sans-serif;font-size:9px;
    color:#7d7d7d;letter-spacing:.3px;margin-top:3px;
  }
  .ct-n{display:block;font-size:12.5px;line-height:1.4;color:#9a9a9a;margin-top:4px}
  .ct-ours{
    display:inline-block;margin-top:5px;padding:1px 5px;
    font-family:"W95FA",Tahoma,sans-serif;font-size:8.5px;letter-spacing:.5px;
    text-transform:uppercase;color:#000;background:#c8c8c8;
  }
  .ct-tag{
    flex:none;align-self:flex-start;margin-top:1px;padding:2px 5px;
    font-family:"W95FA",Tahoma,sans-serif;font-size:8.5px;letter-spacing:.5px;
    text-transform:uppercase;background:var(--neon);color:#000;
  }
  .ct-watch{
    flex-basis:100%;display:block;margin-top:7px;padding-top:6px;
    border-top:1px solid #1e1e1e;font-size:12px;
    color:var(--neon);text-decoration:underline;
  }
  .ct-watch:hover{background:var(--neon);color:#000}
  .ct-meta{
    display:block;margin-top:2px;text-decoration:none;
    font-family:"W95FA",Tahoma,sans-serif;font-size:9px;color:#7d7d7d;
  }
  .ct-watch:hover .ct-meta{color:#222}
  .blog .ct-cap{font-size:11.5px;color:#8a8a8a;margin:10px 0 0}
  .blog .ct-as{
    font-family:"W95FA",Tahoma,sans-serif;font-size:10px;color:#8a8a8a;margin:8px 0 0;
  }
  .blog .ct-as b{color:#fff}
  .blog .ct-err:empty{margin:0}
  .blog .ct-err{color:#ff6a6a;font-size:12px;margin:6px 0 0}
  .blog .ct-pick:empty{margin:0}
  .blog .ct-pick{
    font-family:"W95FA",Tahoma,sans-serif;font-size:11px;color:#fff;margin:9px 0 0;
  }
  /* .votebtn and .sticker were named in the touch target block and nowhere
     else, so neither had ever had a look of its own. */
  .blog .votebtn{display:block;width:100%;margin:11px 0 0;font-size:12.5px}
  .blog .sticker{
    display:inline-block;padding:7px 12px;text-decoration:none;
    font-family:"W95FA",Tahoma,sans-serif;font-size:11px;font-weight:bold;
    letter-spacing:1px;text-transform:uppercase;
    background:var(--neon);color:#000;transform:rotate(-1.5deg);
    box-shadow:0 0 12px color-mix(in srgb, var(--neon) 55%, transparent);
  }
  .blog .sticker:hover{transform:rotate(1deg)}

  /* ══════════ THE SHOW: LIVE ══════════
     The front door. Light, because it is information, and it sits inside the
     chat room window so the cast's answers underneath still read as the same
     conversation. */
  .live{padding:10px 11px 12px;background:#fff;border-bottom:1px solid var(--chrome-dk)}
  .ph{
    background:#fff8d6;border:1px solid #e6c866;padding:7px 9px;margin:0 0 10px;
    font-size:11.5px;line-height:1.5;color:#4a3800;
  }
  .ph b{color:#1a3d6e}
  .ph a{color:#1a3d6e;font-weight:bold}
  .ph-live{background:#ffe3ec;border-color:#ff2e88;color:#5a0022}
  .ph-live b, .ph-live a{color:#c4005c}
  .ph-after{background:#e8f4ff;border-color:#7ea8dc;color:#1a3d6e}
  .live-h{
    font-family:"Times New Roman",Times,serif;font-size:26px;letter-spacing:-1px;
    color:#1a3d6e;margin:0;line-height:1;
  }
  .live-h span{display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;
    color:#7a869a;margin-top:3px;font-family:"W95FA",Tahoma,sans-serif}
  .live .live-p{font-size:12px;line-height:1.55;color:#42506a;margin:8px 0 10px}
  .live-dates{display:grid;gap:5px}
  .live-date{
    display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;
    background:#f4f7fb;border:1px solid #dae4f0;padding:6px 8px;font-size:12px;
  }
  .live-date b{color:#1a3d6e}
  .live-date span{color:#42506a}
  .live .live-where{font-size:11.5px;color:#42506a;margin:8px 0 8px}
  .live-btn{display:inline-flex;align-items:center;text-decoration:none;font-size:12px;padding:7px 12px}
  .live .live-fine{font-size:9.5px;color:#8a94a6;margin:4px 0 0}
  .live-h3{font-size:12px;color:#1a3d6e;margin:14px 0 6px;letter-spacing:.5px;text-transform:uppercase}
  .live-how{margin:0;padding-left:18px;font-size:12px;line-height:1.55;color:#42506a}
  .live-how li{margin:0 0 5px}
  .live-how a{color:#1a3d6e;text-decoration:none}
  .live-how a b{text-decoration:underline}

  /* ══════════ VIDEO COUNTDOWN, the TRL bits ══════════ */
  .trl-head{display:flex;align-items:flex-end;gap:10px;margin:0 0 6px}
  .trl-badge{
    font-family:Impact,"Arial Narrow",sans-serif;font-size:30px;letter-spacing:1px;
    background:#fff;color:#000;padding:0 6px;line-height:1.05;transform:skew(-8deg);
  }
  .blog .trl-h{
    font-family:"W95FA",Tahoma,sans-serif;font-size:14px;letter-spacing:3px;
    text-transform:uppercase;color:#fff;margin:0;line-height:1.15;flex:1;
  }
  .trl-live{
    font-family:"W95FA",Tahoma,sans-serif;font-size:9px;letter-spacing:1.5px;
    color:#ff2e88;border:1px solid #ff2e88;padding:2px 6px;white-space:nowrap;
  }
  .blog .ct-phase{margin:8px 0 10px}
  .ct-jump{margin:0 0 12px}
  .ct-jump .btn-xp{display:block;text-align:center;text-decoration:none;padding:8px}
  .ct-row{display:block;padding:0;overflow:hidden}
  .ct-thumb{
    display:block;width:100%;position:relative;padding:0;border:0;background:#000;cursor:pointer;
    aspect-ratio:16/9;overflow:hidden;
  }
  .ct-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
  .ct-thumb:hover img{opacity:1}
  .ct-playbtn{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:44px;height:32px;background:rgba(0,0,0,.75);border:1px solid #fff;
    color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;
  }
  .ct-row.on .ct-playbtn{border-color:var(--neon)}
  .ct-embed{aspect-ratio:16/9;background:#000}
  .ct-embed iframe{width:100%;height:100%;border:0;display:block}
  .ct-main{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;position:relative}
  .ct-rank{
    position:absolute;z-index:1;left:0;top:0;
    font-family:Impact,"Arial Narrow",sans-serif;font-size:22px;line-height:1;
    background:var(--neon);color:#000;padding:4px 8px 3px;
  }
  .ct-row.on .ct-rank{background:#fff}
  .ct-main .ct-label{flex:1}
  .ct-main .ct-tag{align-self:flex-start;margin-top:2px}

  /* ══════════ cast mode ══════════ */
  .cf-del, .xa-del{
    background:none;border:1px solid #c00;color:#ff6a6a;cursor:pointer;
    font-family:"W95FA",Tahoma,sans-serif;font-size:10px;padding:5px 9px;
  }
  .xa-del{color:#c00;padding:2px 7px;font-size:9.5px;vertical-align:middle}
  .cf-del:hover, .xa-del:hover{background:#c00;color:#fff}
  .xa-aud{
    font-family:"W95FA",Tahoma,sans-serif;font-size:8.5px;letter-spacing:.5px;
    text-transform:uppercase;background:#dae4f0;color:#1a3d6e;padding:1px 5px;
  }

  /* ══════════ the essay box ══════════ */
  .xa-lab{display:block;font-size:10.5px;color:#1a3d6e;margin:8px 0 3px;font-weight:bold}
  .xa-submit input[type=text], .xa-submit textarea{
    width:100%;box-sizing:border-box;font-family:inherit;font-size:12.5px;
    background:#fff;color:#111;border:1px solid #808080;
    box-shadow:inset 1px 1px 0 #4a4a4a;padding:5px 6px;
  }
  .xanga .xa-err{color:#c00;font-size:11.5px;margin:6px 0 0}
  .xanga .xa-err:empty{margin:0}
  .xa-submit .btn-xp{margin-top:8px}

  /* ══════════ CONFESSIONS & VIBES ══════════
     A Tumblr dashboard living inside the AIM window. Same dark neon ground as
     the Countdown, so it reads as a website the desk has open rather than as a
     new thing bolted on.
     Doubled selectors again wherever a rule lands on a <p>: .pane p beats a
     single class and would paint it dark grey on black. */
  .cf-add{display:flex;gap:6px;margin:10px 0 0}
  .cf-add .btn-xp{flex:1;padding-top:9px;padding-bottom:9px}

  .cf-new{border:1px solid var(--neon);background:#0c0c0c;margin:10px 0 0;padding:0}
  .cf-new fieldset{border:0;margin:0;padding:9px}
  .cf-new legend{
    font-family:"W95FA",Tahoma,sans-serif;font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;background:var(--neon);color:#000;padding:2px 7px;margin-left:0;
  }
  .blog .cf-as{font-size:11.5px;color:#9a9a9a;margin:4px 0 8px}
  .blog .cf-as b{color:#fff}
  .cf-lab{
    display:block;font-family:"W95FA",Tahoma,sans-serif;font-size:10px;
    color:#cfcfcf;letter-spacing:.5px;margin:8px 0 3px;
  }
  .cf-new textarea, .cf-new input[type=text], .cf-new select{
    width:100%;box-sizing:border-box;font-family:inherit;font-size:12.5px;
    background:#fff;color:#111;border:1px solid #808080;
    box-shadow:inset 1px 1px 0 #4a4a4a;padding:5px 6px;
  }
  .cf-new input[type=file]{width:100%;box-sizing:border-box;font-size:11px;color:#bbb}
  .blog .cf-count{font-size:9.5px;color:#7d7d7d;margin:3px 0 0;text-align:right}
  .blog .cf-hint{font-size:11px;color:#8a8a8a;margin:4px 0 0;line-height:1.4}
  .blog .cf-err{color:#ff6a6a;font-size:12px;margin:8px 0 0}
  .blog .cf-err:empty{margin:0}
  .cf-btns{display:flex;gap:6px;margin-top:10px}
  .cf-btns .btn-xp{flex:1}
  /* The honeypot. Off screen rather than display:none, because some scripts
     skip what is display:none and this one is meant to be filled in. */
  .cf-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

  .cf-tabs{display:flex;gap:5px;margin:14px 0 8px;border-bottom:1px solid #262626;padding-bottom:6px}
  .cf-tab{
    background:none;border:1px solid #333;color:#9a9a9a;font-family:"W95FA",Tahoma,sans-serif;
    font-size:10px;letter-spacing:.5px;padding:5px 10px;cursor:pointer;
  }
  .cf-tab.on{background:var(--neon);border-color:var(--neon);color:#000}

  .cf{background:#0a0a0a;border:1px solid #262626;padding:9px;margin:0 0 9px}
  .cf-head{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
  .cf-ico{
    width:36px;height:36px;flex:none;display:block;image-rendering:pixelated;
    border:1px solid #333;background:#000;
  }
  .blog .cf-who{flex:1;min-width:0;font-size:12.5px;color:#9a9a9a;margin:0}
  .blog .cf-who b{
    font-family:"W95FA",Tahoma,sans-serif;font-size:12px;color:#fff;
    word-break:break-word;
  }
  .cf-vibe{
    flex:none;display:inline-flex;align-items:center;gap:4px;padding:2px 6px;
    font-family:"W95FA",Tahoma,sans-serif;font-size:8.5px;letter-spacing:.5px;
    text-transform:uppercase;background:var(--v,#39ff14);color:#000;
  }
  .cf-vibe img{width:12px;height:12px;display:block}
  .blog .cf-body{
    font-size:13.5px;line-height:1.45;color:#d6d6d6;margin:8px 0 0;
    white-space:pre-line;word-break:break-word;
  }
  .cf-body img{width:16px;height:16px;vertical-align:-3px}
  .cf-photo{display:block;max-width:100%;height:auto;margin:9px 0 0;border:1px solid #262626}
  .blog .cf-when{
    font-family:"W95FA",Tahoma,sans-serif;font-size:9px;color:#6e6e6e;
    margin:9px 0 0;letter-spacing:.3px;
  }
  .cf-acts{display:flex;gap:6px;margin-top:7px;border-top:1px solid #1c1c1c;padding-top:7px}
  .cf-note, .cf-warn{
    background:none;border:1px solid #2e2e2e;color:#9a9a9a;cursor:pointer;
    font-family:"W95FA",Tahoma,sans-serif;font-size:10px;padding:5px 9px;
  }
  .cf-note.on{border-color:#ff2e88;color:#ff2e88}
  .cf-note:hover, .cf-warn:hover{border-color:#5a5a5a;color:#ddd}
  .cf-warn{margin-left:auto}
  .cf-warn:disabled{opacity:.5;cursor:default}
  .cf:focus-visible{outline:3px solid #ffd652;outline-offset:2px}

  /* ══════════ THE BLOG — a Xanga ══════════
     White, blue and prim, on purpose. Xanga was not the black neon thing; it
     was the tidy one, and putting the two next to each other is most of why
     they are separate screens. */
  .xanga{background:#fff;padding:0;font-family:Verdana,Tahoma,sans-serif}
  .xa-nav{
    background:#e8eef7;border-bottom:1px solid #b9c8dd;padding:5px 8px;
    font-size:10.5px;color:#4a5a70;
  }
  .xa-nav b{color:#1a3d6e}
  .xanga a{color:#2b5a8c}
  .xa-side{padding:8px 8px 0;display:grid;gap:7px}
  .xa-box{border:1px solid #c3d0e0;background:#f7f9fc}
  .xa-box h3{
    margin:0;background:#dae4f0;border-bottom:1px solid #c3d0e0;
    font-size:10.5px;color:#1a3d6e;padding:3px 7px;letter-spacing:.5px;
  }
  .xanga .xa-box p{font-size:11px;line-height:1.6;color:#42506a;margin:0;padding:6px 7px}
  .xa-main{padding:10px 8px 12px}
  .xanga .xa-h{
    font-family:"Times New Roman",Times,serif;font-size:22px;color:#1a3d6e;
    margin:0 0 4px;letter-spacing:-.5px;
  }
  .xanga .xa-lede{font-size:11.5px;line-height:1.6;color:#5a6a80;margin:0 0 12px}
  .xa-date{
    font-size:12px;color:#1a3d6e;margin:14px 0 6px;padding-bottom:3px;
    border-bottom:1px solid #dfe6f0;
  }
  .xa{border:1px solid #d8e0ec;background:#fff;padding:9px 10px;margin:0 0 9px;position:relative}
  .xa-pin{
    position:absolute;top:-1px;right:-1px;background:#ff2e88;color:#fff;
    font-family:"W95FA",Tahoma,sans-serif;font-size:8.5px;letter-spacing:1px;
    text-transform:uppercase;padding:2px 6px;
  }
  .xanga .xa-t{
    font-family:"Times New Roman",Times,serif;font-size:16px;color:#111;
    margin:0 0 3px;padding-right:52px;
  }
  .xanga .xa-by{font-size:10.5px;color:#7a869a;margin:0 0 7px}
  .xanga .xa-by b{color:#2b5a8c}
  .xa-mm{background:#f4f7fb;border:1px solid #e2e9f2;padding:5px 7px;margin:0 0 8px}
  .xanga .xa-mm p{font-size:10.5px;color:#42506a;margin:1px 0;display:flex;align-items:center;gap:5px}
  .xa-mm img{width:14px;height:14px}
  .xa-body{font-size:12.5px;line-height:1.6;color:#222;word-break:break-word}
  .xa-body p{margin:0 0 8px;font-size:12.5px;line-height:1.6;color:#222}
  .xa-body ul, .xa-body ol{margin:0 0 8px;padding-left:22px}
  .xa-body blockquote{margin:0 0 8px;padding-left:9px;border-left:3px solid #dae4f0;color:#4a5a70}
  .xa-body img{max-width:100%;height:auto}
  .xanga .xa-none{font-size:12px;color:#7a869a;font-style:italic;margin:12px 0}
  .xa-submit{border:1px dashed #c3d0e0;background:#fbfcfe;padding:9px 10px;margin:16px 0 0}
  .xa-submit h3{font-size:12px;color:#1a3d6e;margin:0 0 4px}
  .xanga .xa-submit p{font-size:11.5px;color:#5a6a80;margin:0 0 7px;line-height:1.5}
  .xanga .xa-fine{font-size:9.5px;color:#8a94a6;margin:5px 0 0}
  .xanga .xa-foot{
    text-align:center;font-size:9.5px;color:#8a94a6;margin:14px 0 0;
    border-top:1px solid #e6ecf4;padding-top:7px;
  }

  /* The collective, sitting on the wallpaper rather than on a bar of its own,
     so it reads as part of the desk instead of a footer bolted to the window.
     Drop shadow because the collage underneath is busy and light in places. */
  .aac-foot{
    display:flex;justify-content:center;padding:7px 8px 0;
    background:none;text-decoration:none;
  }
  .aac-foot img{
    height:13px;width:auto;display:block;opacity:.92;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.9)) drop-shadow(0 0 1px rgba(0,0,0,.8));
  }
  .aac-foot:hover img{opacity:1;filter:drop-shadow(0 0 7px rgba(157,230,74,.55)) drop-shadow(0 1px 3px rgba(0,0,0,.9))}

  /* ══════════ chat room ══════════ */
  .cr-wrap{margin:6px 6px 0}
  .cr-log{
    background:#fff;border:1px solid #808080;box-shadow:inset 1px 1px 0 #4a4a4a;
    max-height:252px;overflow-y:auto;
  }
  /* Full width, butted together, no gaps. Each line carries its own colour the
     way a real room did, because everyone picked their own and nobody agreed. */
  .cr-msg{
    padding:3px 5px;line-height:1.3;word-wrap:break-word;overflow-wrap:break-word;
  }
  .cr-sn{font-weight:bold}
  .cr-txt img.i{width:16px;height:16px;vertical-align:-3px}
  .cr-pic{background:#000;color:#fff;padding:5px}
  /* Capped so the room's colour is visible without scrolling. Black on black,
     so the space either side of it does not read as letterboxing. */
  .cr-pic img{display:block;width:100%;height:auto;margin:4px 0 0}

  .cr-people{
    background:#fff;border:1px solid #808080;border-top:0;
    box-shadow:inset 1px 1px 0 #4a4a4a;
  }
  .cr-people-h{
    background:linear-gradient(180deg,#fff,var(--chrome));
    border-bottom:1px solid var(--chrome-dk);
    font-size:10.5px;font-weight:bold;color:#1a3d6e;padding:3px 6px;
  }
  .cr-people-l{
    display:flex;flex-wrap:wrap;gap:2px 10px;padding:5px 6px;
    max-height:52px;overflow-y:auto;font-size:10.5px;color:#111;
  }
  .cr-people-l .gone{color:#a0a0a0}

  .cr-tools{
    display:flex;gap:5px;align-items:center;margin:6px 6px 0;padding:3px 6px;
    background:linear-gradient(180deg,#fff,var(--chrome));
    border:1px solid var(--chrome-dk);border-bottom:0;
  }
  .cr-tools .fbtn{font-family:"Times New Roman",serif;font-size:13px;padding:0 3px;opacity:.55}
  .cr-send{display:flex;gap:6px;align-items:stretch;margin:0 6px}
  .cr-entry{
    flex:1;background:#f4f2e8;border:1px solid #808080;
    box-shadow:inset 1px 1px 0 #4a4a4a;
    font-family:"Times New Roman",serif;font-size:12.5px;color:#999;
    font-style:italic;padding:7px 8px;
  }
  .cr-send .btn-xp{flex:none;padding:5px 12px}

  .cr-panel{
    margin:8px 6px 6px;padding:7px 8px;background:#fff;
    border:1px solid var(--chrome-dk);font-size:11.5px;
  }
  .cr-panel > b{display:block;color:#c00;font-size:12px;margin-bottom:4px}

  /* ══════════ playlists ══════════ */
  .pl-row{
    display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;
    border-bottom:1px solid #eceef2;cursor:pointer;text-align:left;
    font-family:inherit;padding:7px 8px;color:#111;
  }
  .pl-row.on{background:linear-gradient(180deg,#7ea8dc,#3f6ea8 60%,#35608f);color:#fff}
  .pl-art{
    width:26px;height:26px;flex:none;border:1px solid #b9b3a0;
    background:linear-gradient(135deg,#f4f1e4,#d8d3c0);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#555;
  }
  .pl-row.on .pl-art{background:linear-gradient(135deg,#fff,#cfe0f5);border-color:#2b5a8c;color:#2b5a8c}
  .pl-meta{flex:1;min-width:0}
  .pl-t{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-b{display:block;font-size:9.5px;color:#7a8699;margin-top:1px}
  .pl-row.on .pl-b{color:#dce8f8}
  .pl-chev{color:#7a8699;font-size:12px;flex:none}
  .pl-open{background:#f7f8fb;border-bottom:1px solid #e2e5ec;padding:6px 8px 8px}
  .pl-desc{font-size:10.5px;color:#556;margin:0 0 6px;font-style:italic}
  .pl-empty{font-size:10.5px;color:#889;margin:0;font-style:italic}
  .pl-tracks{margin:0;padding-left:22px;font-size:11.5px;color:#222}
  .pl-tracks li{margin-bottom:5px}
  .tr-t{display:block;font-weight:bold}
  .tr-a{display:block;font-size:10px;color:#6a7385}
  .tr-n{display:block;font-size:10px;color:#8a7b1e;font-style:italic;margin-top:1px}
  /* ══════════ graveyard ══════════ */
  .stone{
    background:#e4e2da;border:1px solid #b8b4a4;border-radius:26px 26px 3px 3px;
    padding:10px 6px 8px;text-align:center;font-family:"Times New Roman",serif;
  }
  .stone b{display:block;font-size:12px}
  .stone i{font-size:10px;color:#666;line-height:1.4;display:block;margin-top:2px}
  .stones{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px}

  /* ══════════ toolbar ══════════ */
  .toolbar{
    display:flex;justify-content:space-between;
    background:linear-gradient(180deg,#ffe98c,var(--aim-yellow) 55%,#f4b93c);
    border-top:1px solid #c89b2a;padding:3px 1px;
  }
  .tool{
    flex:1;background:none;border:1px solid transparent;border-radius:3px;font-family:inherit;
    font-size:8.5px;color:#4a3000;text-align:center;cursor:pointer;padding:3px 1px;line-height:1.2;
    text-decoration:none;display:block;
  }
  .tool .t-ico{display:block;font-size:13px;margin-bottom:1px}
  .tool.on{background:rgba(255,255,255,.55);border-color:#a87d1c}
  /* Eight sections do not fit across a phone in one row: each button lands at
     about 32px, well under the 44px this project holds itself to. Two rows of
     four gives every one of them room, and a taskbar two rows deep is more
     Windows than less. */
  /* Five sections now. 18% each puts all five on one row at 375px wide with
     every button about 72px, and stops the last one wrapping alone onto a
     second row and stretching across it. */
  @media (max-width: 560px){
    .toolbar{flex-wrap:wrap}
    .tool{flex:1 1 18%;padding-left:0;padding-right:0}
  }
  .tool:active{border-color:#a87d1c;background:rgba(255,255,255,.4)}
  .statusline{
    font-size:10px;color:#666;padding:3px 8px;background:var(--chrome);
    border-top:1px solid #fff;display:flex;justify-content:space-between;gap:6px;
  }

  /* ══════════ popups ══════════ */
  .overlay{
    position:fixed;inset:0;background:rgba(0,20,60,.45);
    display:none;align-items:center;justify-content:center;padding:12px;z-index:50;
  }
  .overlay.open{display:flex}
  .popwin{max-width:320px;width:100%}
  .im-log{
    background:#fff;border:1px solid var(--chrome-dk);margin:6px;
    min-height:110px;max-height:38vh;overflow-y:auto;
    font-family:"Times New Roman",serif;font-size:14px;padding:6px 8px;line-height:1.4;
  }
  .im-log > div{margin-bottom:4px}
  .who-me{color:#cc0000;font-weight:bold}
  .who-them{color:#0000cc;font-weight:bold}
  .auto{color:#7d7d7d;font-style:italic}
  .msg-styled{font-family:"Comic Sans MS","Comic Sans",cursive;white-space:pre-line}
  .im-log img.i{width:16px;height:16px}
  /* an away message in the buddy's own colors — the whole point of 2006 */
  .away-card{
    margin:4px 0 2px;padding:7px 8px;border:1px solid rgba(0,0,0,.35);
    font-size:12.5px;
    white-space:pre-line;line-height:1.35;
  }
  .im-tools{
    display:flex;gap:4px;align-items:center;margin:0 6px;padding:2px 4px;
    background:linear-gradient(180deg,#fff,var(--chrome));
    border:1px solid var(--chrome-dk);border-bottom:0;font-size:12px;color:#333;
  }
  .im-tools .fbtn{
    font-family:"Times New Roman",serif;padding:1px 5px;border:1px solid transparent;
    background:none;cursor:pointer;font-size:13px;
  }
  .im-tools .fbtn:active{border-color:var(--chrome-dk);background:#ddd9c8}
  .smileybar{display:none;flex-wrap:wrap;gap:2px;margin:0 6px;padding:4px;background:#fff;border:1px solid var(--chrome-dk);border-bottom:0}
  .smileybar.open{display:flex}
  .smileybar button{background:none;border:1px solid transparent;cursor:pointer;padding:2px;line-height:0}
  .smileybar button:active{border-color:var(--sel);background:#dce8f8}
  .smileybar img{width:16px;height:16px}
  .im-entry{
    margin:0 6px;border:1px solid var(--chrome-dk);background:#fff;
    font-family:"Times New Roman",serif;font-size:14px;padding:6px 8px;
    min-height:42px;width:calc(100% - 12px);resize:none;display:block;
  }
  .im-entry:disabled{background:#f4f2e8;color:#999;font-style:italic}
  .im-actions{display:flex;justify-content:flex-end;gap:6px;padding:6px;align-items:center}
  .typing{margin-right:auto;font-size:10px;color:#888;font-family:inherit;padding-left:4px}
  .btn-xp{
    font-family:inherit;font-size:11px;
    background:linear-gradient(180deg,#fff,#ece9d8);
    border:1px solid #003c74;border-radius:3px;padding:5px 14px;cursor:pointer;
  }
  .btn-xp:active{background:#ddd9c8}
  .btn-xp.primary{font-weight:bold}
  .btn-xp:disabled{opacity:.5;cursor:default}
  .info-body{padding:10px;font-size:12px}
  .info-row{display:flex;gap:6px;padding:3px 0;border-bottom:1px solid #e4e0d0}
  .info-row b{width:100px;flex:none;color:#1a3d6e}
  .prof-label{
    font-size:9px;letter-spacing:1px;font-family:"W95FA",Tahoma,sans-serif;
    opacity:.75;display:block;margin-bottom:3px;
  }
  .info-prof{
    margin-top:8px;border:1px solid var(--chrome-dk);
    padding:8px;font-size:12.5px;
    white-space:pre-line;line-height:1.35;
  }
  /* ══════════ 4. tap targets ══════════
     Only where the pointer is coarse. A mouse is precise and the tight AIM
     spacing is the whole look, so the desktop keeps it; a finger gets room. */
  @media (pointer: coarse){
    .buddy{padding-top:11px;padding-bottom:11px}
    .so-anon{padding-top:12px;padding-bottom:12px}
    /* Padding alone lands these at 37px. The project holds itself to 44. */
    .btn-xp{padding-top:11px;padding-bottom:11px;min-height:44px}
    .votebtn{padding-top:10px;padding-bottom:10px}
    .blog-list li{padding:4px 0}
    .so-input input{padding-top:9px;padding-bottom:9px}
    .field input, .im-entry{padding-top:10px;padding-bottom:10px}
    .aac-foot{padding-top:12px;padding-bottom:10px}
    .sticker{padding-top:11px;padding-bottom:11px}
    .blog-link{display:inline-block;padding:5px 0}
    .grp{padding-top:12px;padding-bottom:8px}
    .menubar button{padding:11px 12px;min-height:44px}
    .tb-btn{width:34px;height:30px;line-height:28px}
    .tool{padding:10px 6px}
    .pod-menu button{padding-top:13px;padding-bottom:13px}
    .so-btn{padding:10px 12px}
    .pl-row, .say, .tape{min-height:44px}
    .ct-label, .gm-a{padding-top:6px;padding-bottom:6px}
    .cf-del, .xa-del{min-height:44px}
    .xa-submit input[type=text], .xa-submit textarea{padding-top:10px;padding-bottom:10px;min-height:44px}
    .cf-note, .cf-warn, .cf-tab{min-height:44px}
    .cf-new textarea, .cf-new input[type=text], .cf-new select{
      padding-top:10px;padding-bottom:10px;min-height:44px}
    /* A file input sizes to its native button, which is short. Padding the
       control is the only way to give the tap somewhere to land. */
    .cf-new input[type=file]{padding:12px 0;min-height:44px}
    /* min-height does nothing to an inline box, which is why these were still
       landing at 25px with padding on them. */
    .xa-nav a, .xa-box a{display:inline-block;padding:10px 0;min-height:44px;line-height:24px}
    .xa-submit .btn-xp{display:inline-flex;align-items:center;min-height:44px}
    /* The four "how to play along" links are the front door's calls to
       action, not incidental prose, so they get a real target on touch. */
    .live-how a{display:inline-block;padding:10px 0;min-height:44px;line-height:24px}
    .ct-watch{min-height:44px}
    .ct-radio{width:18px;height:18px}
    .votebtn, .sticker{min-height:44px}
    .smileybar button{padding:8px}
    .wheel .lbl{padding:10px 12px}
  }

</style>
</head>

   per browser rather than per internet address. Per address would mean a whole
   theatre on one wifi shares one allowance, and the wall would die ninety
   seconds into the show for everybody at once. */
function deviceTag(){
  let d = LS.get("device", null);
  if(!/^[a-z0-9]{16,40}$/.test(d || "")){
    d = Array.from(crypto.getRandomValues(new Uint8Array(12)))
             .map(b => b.toString(36).padStart(2, "0")).join("").slice(0, 24);
    LS.set("device", d);
  }
  return d;
}

/* Every timestamp on this site renders with the year forced to 2006 and the
   weekday recomputed for that real 2006 date, so it reads as a date that
   genuinely existed rather than as this year wearing a hat. A seed row already
   dated 2006 comes out as itself. One rule, no special cases. */
const DAYS   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August",
                "September","October","November","December"];
function stamp2006(iso){
  const d = new Date(iso);
  if(isNaN(d)) return "";
  const y = new Date(2006, d.getMonth(), d.getDate(), d.getHours(), d.getMinutes());
  let h = y.getHours(); const ap = h < 12 ? "am" : "pm";
  h = h % 12; if(h === 0) h = 12;
  const mm = String(y.getMinutes()).padStart(2, "0");
  return DAYS[y.getDay()] + ", " + MONTHS[y.getMonth()] + " " + y.getDate() +
         ", 2006 \u00b7 " + h + ":" + mm + " " + ap;
}

/* Sits on the wallpaper under whatever window is open, so it belongs to the
   desk rather than to the app. Every screen gets it, including the iPod and
   the sign on window, which do not go through chrome(). */
function aacFooter(){
  return `<a class="aac-foot" href="https://artisticaccessibility.com"
     target="_blank" rel="noopener noreferrer" aria-label="Artistic Accessibility Collective, home">

function toolbarHTML(){

  return `<nav class="toolbar" aria-label="Sections">

const SCREEN_TITLES = {
  signon:'Sign On', home:'iPod menu', buddies:'Buddy list, the cast of 2006',
  videos:'Video Countdown', playlists:'Playlists', reminisce:'Reminisce',
  play:'Play, games that still work',
  wall:'Confessions and Vibes', blog:'The Blog',
  graveyard:'The Graveyard', show:'The Show: Live',
};
function render(){
  const h1 = document.getElementById('screen-title');
  if (h1) h1.textContent = (SCREEN_TITLES[screen] || '2006') + ' · 2006';
  if(screen==="signon")         app.innerHTML = viewSignOn();
  else if(screen==="home")      app.innerHTML = viewHome();
  else if(screen==="buddies")   app.innerHTML = viewBuddies();
  else if(screen==="videos")    app.innerHTML = viewCountdown();
  else if(screen==="playlists") app.innerHTML = viewPlaylists();
  else if(screen==="play")      app.innerHTML = viewPlay();
  else if(screen==="wall")      app.innerHTML = viewWall();
  else if(screen==="blog")      app.innerHTML = viewBlog();
  else if(screen==="graveyard") app.innerHTML = viewGraveyard();
  else if(screen==="reminisce") app.innerHTML = viewHome(REMINISCE, "Reminisce");
  else                          app.innerHTML = viewShow();
  app.querySelectorAll("[data-go]").forEach(el=>{
    el.onclick = (e)=>{ e.preventDefault(); screen = el.dataset.go; selected=-1; render(); };
  });
  if(screen==="signon")  wireSignOn();
  if(screen==="home")    wireHome();
  if(screen==="buddies") wireBuddies();
  if(screen==="videos")  wireCountdown();
  if(screen==="playlists") wirePlaylists();
  if(screen==="wall")    wireWall();
  if(screen==="blog")    wireBlog();
  if(screen==="show")    wireShow();
  if(screen==="reminisce") wireHome(REMINISCE);
  clearInterval(window.__tick); window.__tick = null;
  if(screen==="videos" && phase()==="live") window.__tick = setInterval(loadStandings, 20000);
}

function anonName(){
  if(!ANON_NAMES.length) return "Anon" + Math.floor(Math.random()*9000+1000);
  const used = LS.get("usedNames", []);
  const free = ANON_NAMES.filter(n => !used.includes(n));
  const pick = (free.length ? free : ANON_NAMES)[Math.floor(Math.random()*(free.length||ANON_NAMES.length))];
  const name = free.length ? pick : pick + Math.floor(Math.random()*89+10);
  LS.set("usedNames", used.concat([pick]).slice(-40));
  return name;
}

/* ══════════════════ VIDEO COUNTDOWN ══════════════════
   Two sections, named in Mary Kate's words: "practice voting with these
   iconic pieces" and "submit your own homemade 2006 video". No commentary on
   the rows, just the video. A thumbnail you can press to play it right there,
   one at a time, because twelve players loading at once is a mess on a phone
   and a maze for a keyboard.

   Three phases, see phase(). In practice the pick lives in this browser. When
   voting is live the pick goes to /api/2006/vote, the standings come back
   from the database, and the list re-sorts into the order the show will play.
   ═══════════════════════════════════════════════════════════════════════════ */
let openEmbed = null;

function statusText(){
  const p = phase();
  if(p === "live") return myVote ? "your vote: " + titleOf(myVote) : "voting is open";
  return myVote ? "your pick: " + titleOf(myVote) : VIDEOS.length + " videos · practice vote";
}

function orderedVideos(){
  const rows = VIDEOS.slice();
  if(phase() === "live"){
    rows.sort((a,b) => ((STANDINGS[b.slot]||0) - (STANDINGS[a.slot]||0)) || (a.ord - b.ord));
  } else {
    rows.sort((a,b) => a.ord - b.ord);
  }
  return rows;
}

function countdownRow(v, i, live){
  const on = myVote === v.slot;
  const votes = STANDINGS[v.slot] || 0;
  const rank = live ? i + 1 : null;
  const embed = openEmbed === v.slot;
  const media = embed
    ? `<div class="ct-embed"><iframe
         src="https://www.youtube-nocookie.com/embed/${esc(v.yt)}?autoplay=1&rel=0"
         title="${esc(v.title)}, ${esc(v.artist)}" allow="autoplay; encrypted-media; picture-in-picture"
         allowfullscreen></iframe></div>`
    : `<button type="button" class="ct-thumb" data-play="${esc(v.slot)}"
         aria-label="play ${esc(v.title)} by ${esc(v.artist)}">
         <img src="https://i.ytimg.com/vi/${esc(v.yt)}/hqdefault.jpg" alt="" loading="lazy">
         <span class="ct-playbtn" aria-hidden="true">▶</span>
       </button>`;
  return `
    <div class="ct-row ${on ? "on" : ""} ${embed ? "open" : ""}">
      ${rank ? `<span class="ct-rank" aria-hidden="true">${rank}</span>` : ``}
      ${media}
      <div class="ct-main">
        <input type="radio" name="ballot" class="ct-radio" id="b-${esc(v.slot)}"
               value="${esc(v.slot)}" ${on ? "checked" : ""}>
        <label class="ct-label" for="b-${esc(v.slot)}">
          <span class="ct-t">${rank ? `<span class="sr-only">number ${rank}, </span>` : ``}${esc(v.title)}</span>
          <span class="ct-a">${esc(v.artist)} &nbsp;·&nbsp; ${esc(v.year || "")}${
            v.ours ? ` &nbsp;·&nbsp; <span class="ct-ours">our version</span>` : ``}${
            live ? ` &nbsp;·&nbsp; ${votes} vote${votes === 1 ? "" : "s"}` : ``}</span>
        </label>
        ${on ? `<span class="ct-tag" aria-hidden="true">${live ? "your vote" : "your pick"}</span>` : ``}
      </div>
    </div>`;
}

function viewCountdown(){
  const p = phase(), live = p === "live";
  const rows = orderedVideos().map((v, i) => countdownRow(v, i, live)).join("");
  const submitUrl = CONFIG.SUBMIT_FORM_URL || LINKS.submit;

  const body = `
    <div class="pane blog trl">
      <div class="trl-head">
        <span class="trl-badge">TRL</span>

      ${live ? `<p class="blog-p ct-phase"><b>voting is open and it counts.</b> we check

      <form id="ballot" novalidate>

             target="_blank" rel="noopener noreferrer">📼 SUBMIT UR VIDEO</a>
        </p>

      </section>

    </div>`;
  return chrome("Video Countdown", body, {status: statusText()});
}
const NEON = ["#39ff14", "#ff00ff", "#00f0ff", "#ffe600", "#ff6a00", "#ff2e88"];

async function loadStandings(){
  if(phase() !== "live") return;
  try {
    const rows = await sbGet("production_countdown_standings?select=video_id,votes");
    if(Array.isArray(rows)){
      const next = {};
      rows.forEach(r => { if(VIDEOS.some(v => v.slot === r.video_id)) next[r.video_id] = r.votes; });
      STANDINGS = next;
      if(screen === "videos" && !document.activeElement.closest?.("#ballot")) render();
    }
  } catch(e){ console.warn("2006: standings", e); }
}

function wireCountdown(){
  const jump = document.getElementById("ct-jumpbtn");
  if(jump) jump.onclick = e => {
    e.preventDefault();
    const t = document.getElementById("ct-submit");
    t.scrollIntoView({behavior:"smooth", block:"start"}); t.focus();
  };

  app.querySelectorAll("[data-play]").forEach(b => {
    b.onclick = () => {
      openEmbed = b.dataset.play; render();
      const f = document.querySelector(".ct-row.open iframe"); if(f) f.focus();
      say("playing " + titleOf(openEmbed) + ".");
    };
  });

  const form = document.getElementById("ballot");
  form.onsubmit = async e => {
    e.preventDefault();
    const chosen = form.querySelector('input[name="ballot"]:checked');
    const err = document.getElementById("ct-err");
    if(!chosen){ err.textContent = "pick one first, then press the button."; say(err.textContent); return; }
    err.textContent = "";

    if(phase() === "live"){
      if(!ME.sn){ err.textContent = "sign on with a screen name first."; say(err.textContent); return; }
      const btn = document.getElementById("castbtn"); btn.disabled = true;
      let out = null;
      try {
        const r = await fetch("/api/2006/vote", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({videoId: chosen.value, screenName: ME.sn, device: deviceTag(), website: ""})});
        out = await r.json();
      } catch(x){ out = {ok:false, message:"the internet did that thing. try again?"}; }
      btn.disabled = false;
      if(!out.ok){ err.textContent = out.message || "that did not count."; say(err.textContent); return; }
      myVote = chosen.value; LS.set("vote", myVote);
      say("vote counted. your vote is " + titleOf(myVote) + ".");
      await loadStandings(); render();
      const again = document.getElementById("castbtn"); if(again) again.focus();
      return;
    }

    myVote = chosen.value; LS.set("vote", myVote);
    document.getElementById("ct-pick").textContent = "your pick: " + titleOf(myVote) + ".";
    document.getElementById("castbtn").textContent = "change my practice vote";
    const sm = document.getElementById("statusmsg"); if(sm) sm.textContent = statusText();
    app.querySelectorAll(".ct-row").forEach(r => {
      const on = r.querySelector("input").value === myVote;
      r.classList.toggle("on", on);
      const tag = r.querySelector(".ct-tag");
      if(on && !tag){ const t = document.createElement("span"); t.className = "ct-tag";
        t.setAttribute("aria-hidden","true"); t.textContent = "your pick"; r.querySelector(".ct-main").appendChild(t); }
      else if(!on && tag) tag.remove();
    });
    say("practice vote saved. your pick is " + titleOf(myVote) + ".");
  };
}

            : `<p class="pl-empty">no songs on this one yet.</p>`}
        </div>` : ``}`;
  }).join("");

  const body = `
    <div class="pane">
      <div class="pane-pad" style="padding-bottom:6px">
        <h2>Playlists</h2>
        <p>mixes made by the people in the show. tap one to see what's on it.</p>
      </div>
      ${rows}
    </div>`;
  return chrome("Playlists", body, {status: playlists.length + " playlists"});
}

/* ══════════════════ CONFESSIONS & VIBES ══════════════════
   The wall. Two buttons at the top, one feed underneath, and a post is public
   the instant somebody presses the button. No approval step, by design.

   Nothing here decides anything. The page cannot: the anon key is printed in
   this file's source, so every rule that matters lives in /api/2006/confess on
   our own server. What is here is the door, the drawing, and the manners.

   The draft is mirrored into localStorage on every keystroke, because render()
   rebuilds the whole of #app and loadLive() calls it again about a second after
   the page opens. Without that, a network reply arriving mid sentence would
   wipe what somebody was typing.
   ═══════════════════════════════════════════════════════════════════════════ */
let wall = [], wallLoaded = false, wallTab = "newest", wallBusy = false, wallMsg = "";
let composer = null;                       // null, "anon" or "me"
let myNotes = LS.get("notes", {}) || {};
let photoOK = LS.get("photoOK", false);

function draftGet(){ return LS.get("draft", {}) || {}; }
function draftSet(patch){ LS.set("draft", Object.assign(draftGet(), patch)); }
function draftClear(){ LS.set("draft", {}); }

function wallSorted(){
  const rows = wall.slice();
  if(wallTab === "notes"){
    rows.sort((a,b) => (b.notes_count - a.notes_count)
                    || (new Date(b.posted_at) - new Date(a.posted_at)));
  } else {
    rows.sort((a,b) => new Date(b.posted_at) - new Date(a.posted_at));
  }
  return rows;
}

function confessionCard(p){
  const who  = p.is_anon ? "anonymous" : (p.screen_name || "someone");
  const said = p.is_anon ? "confessed" : "said";
  const ico  = p.is_anon ? (ICONS.runman || ICONS.online) : iconFor(who);
  const vb   = vibeOf(p.vibe);
  const when = stamp2006(p.posted_at);
  const noted = !!myNotes[p.id];
  const n = p.notes_count || 0;
  const label = who + " " + said + ", " + when
              + (vb ? ", feeling " + vb.v : "")
              + ", " + n + " note" + (n === 1 ? "" : "s");
  return `
    <article class="cf" data-id="${esc(p.id)}" aria-label="${esc(label)}">
      <div class="cf-head">
        <img class="cf-ico" src="${esc(ico)}" alt="">
        <p class="cf-who"><b>${esc(who)}</b> ${said}:</p>
        ${vb ? `<span class="cf-vibe" style="--v:${vb.c}">${
          ICONS[vb.i] ? `<img src="${ICONS[vb.i]}" alt="">` : ``}${esc(vb.v)}</span>` : ``}
      </div>
      ${p.body ? `<p class="cf-body">${smileyfy(p.body)}</p>` : ``}
      ${p.image_path ? `<img class="cf-photo" src="${esc(p.image_path)}"
           alt="${esc(p.image_alt || "")}" loading="lazy">` : ``}
      <p class="cf-when">${esc(when)}</p>
      <div class="cf-acts">
        <button class="cf-note ${noted ? "on" : ""}" data-note="${esc(p.id)}"
                aria-pressed="${noted ? "true" : "false"}">
          <span aria-hidden="true">${noted ? "♥" : "♡"}</span>
          <span class="cf-n">${n}</span> note${n === 1 ? "" : "s"}</button>
        <button class="cf-warn" data-warn="${esc(p.id)}">
          <span aria-hidden="true">⚠</span> warn</button>
        ${CAST ? `<button class="cf-del" data-del-wall="${esc(p.id)}">delete</button>` : ``}
      </div>
    </article>`;
}

  const title = mine ? "add to the vibe" : "anon confession";
  const opts = VIBES.map(v =>

  return `

        <label class="cf-lab" for="cf-body">${mine ? "what is the vibe" : "what is it"}</label>
        <textarea id="cf-body" maxlength="500" rows="3"

          <input type="text" id="cf-alt" maxlength="200" value="${esc(d.alt || "")}"
                 placeholder="me and my sister in matching juicy tracksuits">
          <p class="cf-hint">one line. people who cannot see the picture get this instead.</p>
          <div id="cf-gate" ${photoOK ? "hidden" : ""}>

function viewWall(){
  const rows = wallSorted();
  const feed = !wallLoaded
    ? `<p class="blog-p">loading the wall...</p>`
    : rows.length
      ? rows.map(confessionCard).join("")
      : `<p class="blog-p">nothing on the wall yet. be the first one, it is the
           hardest and the best job.</p>`;

  const body = `
    <div class="pane blog">
      <h2 class="blog-h">confessions &amp; vibes</h2>
      <p class="blog-p">
        say a thing. it goes up the second you press the button, nobody checks it
        first. post as yourself or post as nobody, then give other people's
        notes so the good ones climb.
      </p>

      <div class="cf-add">
        <button class="btn-xp primary" data-open="anon">anon confession</button>
        <button class="btn-xp primary" data-open="me">add to the vibe</button>
      </div>
      ${composerHTML()}

      <div class="cf-tabs" role="group" aria-label="how to sort the wall">
        <button class="cf-tab ${wallTab === "newest" ? "on" : ""}" data-tab="newest"
                aria-pressed="${wallTab === "newest"}">newest</button>
        <button class="cf-tab ${wallTab === "notes" ? "on" : ""}" data-tab="notes"
                aria-pressed="${wallTab === "notes"}">most notes</button>
      </div>

      <div class="cf-feed" id="cf-feed">${feed}</div>

      <p class="blog-sig">
        every date on here is a real 2006 date &nbsp;·&nbsp; warn a post three times

  return chrome("Confessions & Vibes", body,

async function loadWall(){
  try {
    const rows = await sbGet(
      "production_confessions?select=id,is_anon,screen_name,body,vibe,image_path,image_alt,"
      + "notes_count,posted_at,productions!inner(slug)"
      + `&productions.slug=eq.${encodeURIComponent(CONFIG.SLUG)}`
      + "&order=posted_at.desc&limit=200"
    );
    if(Array.isArray(rows)) wall = rows;
  } catch(e){
    // Stale beats broken. An empty wall with a loading line stuck on it is
    // worse than an empty wall that admits it could not reach anything.
    console.warn("2006: could not load the wall.", e);
  }
  wallLoaded = true;
  if(screen === "wall") render();
}

function wireWall(){
  if(!wallLoaded && !wall.length) loadWall();

  app.querySelectorAll("[data-open]").forEach(b => {
    b.onclick = () => {
      composer = b.dataset.open; wallMsg = ""; render();
      const t = document.getElementById("cf-body");
      if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
      say(composer === "anon" ? "anonymous confession box open."
                              : "posting as " + (ME.sn || "you") + ".");
    };
  });

  app.querySelectorAll("[data-tab]").forEach(b => {
    b.onclick = () => {
      wallTab = b.dataset.tab; render();
      const first = document.querySelector(`[data-tab="${wallTab}"]`);
      if(first) first.focus();
      say(wallTab === "notes" ? "sorted by most notes." : "sorted by newest.");
    };
  });

  const form = document.getElementById("composer");
  if(form){
    const t = document.getElementById("cf-body");
    const left = document.getElementById("cf-left");
    t.oninput = () => {
      draftSet({body: t.value});
      if(left) left.textContent = 500 - t.value.length;
    };
    document.getElementById("cf-vibe").onchange = e => draftSet({vibe: e.target.value});
    const alt = document.getElementById("cf-alt");
    if(alt) alt.oninput = () => draftSet({alt: alt.value});

    // Revealed rather than re-rendered, so choosing a file never throws focus
    // back to the top of the window.
    const pic = document.getElementById("cf-photo");
    pic.onchange = () => {
      document.getElementById("cf-pic").hidden = !pic.files.length;
      if(pic.files.length){
        say("picture chosen. say what is in it before you post.");
        const a = document.getElementById("cf-alt"); if(a) a.focus();
      }
    };

    document.getElementById("cf-cancel").onclick = () => {
      composer = null; wallMsg = ""; draftClear(); render();
      const back = document.querySelector('[data-open="anon"]');
      if(back) back.focus();
    };

    form.onsubmit = e => { e.preventDefault(); postConfession(); };
  }

  wireModerate();
  app.querySelectorAll("[data-note]").forEach(b => {
    b.onclick = () => react(b.dataset.note, "note", b);
  });
  app.querySelectorAll("[data-warn]").forEach(b => {
    b.onclick = () => {
      if(b.dataset.sure !== "1"){
        b.dataset.sure = "1"; b.textContent = "sure?";
        setTimeout(() => { if(b.dataset.sure === "1"){
          b.dataset.sure = ""; b.innerHTML = '<span aria-hidden="true">⚠</span> warn';
        }}, 4000);
        return;
      }
      react(b.dataset.warn, "warn", b);
    };
  });
}

async function postConfession(){
  if(wallBusy) return;
  const t   = document.getElementById("cf-body");
  const pic = document.getElementById("cf-photo");
  const alt = document.getElementById("cf-alt");
  const ans = document.getElementById("cf-ans");
  const err = document.getElementById("cf-err");
  const file = pic && pic.files.length ? pic.files[0] : null;

  if(!t.value.trim() && !file){
    err.textContent = "there is nothing in it yet."; say("there is nothing in it yet."); return;
  }
  if(file && !(alt && alt.value.trim())){
    err.textContent = "say what is in the picture first. one line is plenty.";
    say("say what is in the picture first."); if(alt) alt.focus(); return;
  }

  const fd = new FormData();
  fd.set("device", deviceTag());
  fd.set("anon", composer === "anon" ? "1" : "0");
  fd.set("screenName", ME.sn || "");
  fd.set("body", t.value);
  fd.set("vibe", document.getElementById("cf-vibe").value);
  fd.set("website", document.getElementById("cf-hp").value);
  if(file){
    fd.set("photo", file);
    fd.set("alt", alt.value);
    if(ans && !ans.closest("#cf-gate").hidden) fd.set("answer", ans.value);
    else fd.set("answer", LS.get("photoAns", ""));
  }

  wallBusy = true; wallMsg = ""; render();
  let out = null;
  try {
    const r = await fetch("/api/2006/confess", {method: "POST", body: fd});
    out = await r.json();
  } catch(e){
    out = {ok: false, message: "the internet did that thing. try again?"};
  }
  wallBusy = false;

  if(!out || !out.ok){
    wallMsg = (out && out.message) || "that did not go through.";
    render(); say(wallMsg);
    const e2 = document.getElementById("cf-err"); if(e2) e2.focus?.();
    return;
  }

  // The answer worked, so this browser never sees the question again.
  if(file){
    photoOK = true; LS.set("photoOK", true);
    if(ans && ans.value) LS.set("photoAns", ans.value);
  }
  if(out.post) wall.unshift(out.post);
  composer = null; wallMsg = ""; draftClear(); wallTab = "newest";
  render();
  say("posted. it is on the wall now.");
  const first = document.querySelector(".cf");
  if(first){ first.setAttribute("tabindex", "-1"); first.focus(); }
}

async function react(id, kind, btn){
  const pressed = btn.getAttribute("aria-pressed") === "true";
  try {
    const r = await fetch("/api/2006/react", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id, kind, device: deviceTag(), undo: kind === "note" && pressed}),
    });
    const out = await r.json();
    if(!out.ok){ say(out.message || "that did not land."); return; }

    if(kind === "note"){
      const now = !pressed;
      if(now) myNotes[id] = 1; else delete myNotes[id];
      LS.set("notes", myNotes);
      btn.setAttribute("aria-pressed", now ? "true" : "false");
      btn.classList.toggle("on", now);
      btn.querySelector("span").textContent = now ? "♥" : "♡";
      const c = btn.querySelector(".cf-n"); if(c) c.textContent = out.notes;
      const row = wall.find(p => p.id === id); if(row) row.notes_count = out.notes;
      say(now ? "noted." : "note taken back.");
    } else {
      btn.disabled = true; btn.textContent = "warned";
      say("warned. thank you.");
      if(out.gone){
        wall = wall.filter(p => p.id !== id);
        say("that post has come off the wall.");
        render();
      }
    }
  } catch(e){ say("that did not land. try again?"); }
}

/* ══════════════════ THE BLOG — a Xanga ══════════════════
   Written by the cast in Backstage, where the colour swatches and the fonts
   already live. This screen is the window those posts appear in.

   Newest first, always, which is the reason this is a separate screen from the
   wall: the wall floats the most liked to the top, and an essay somebody wrote
   during the show has to be at the top because it just happened, not lose its
   place to a confession from last week with forty notes. One list cannot do
   both.

   White and blue and prim, deliberately, against the black neon of the
   Countdown and the wall. Xanga really did look like this.
   ═══════════════════════════════════════════════════════════════════════════ */
let posts = [], postsLoaded = false;

/* The cast writes formatted text, so real formatting has to reach the screen,
   and this is the one place a page built by hand can get hurt.

   Hand the string to the browser's own parser, then walk it and keep a short
   fixed list of tags, rebuilding each one from scratch rather than copying
   anything the writer typed. The parser is the point: it decodes character
   references before we ever look at an address, so the old trick of writing
   javascript: with an encoded letter in it is already decoded by the time the
   scheme is checked, and dies by construction rather than by anyone
   remembering to block it. */
const OK_TAGS = {
  p:[], br:[], hr:[], strong:[], b:[], em:[], i:[], u:[], s:[], strike:[], del:[],
  h2:[], h3:[], h4:[], ul:[], ol:[], li:[], blockquote:[], figure:[], figcaption:[],
  a:["href"], span:["style"],
};
const OK_FONTS = [
  "Comic Sans MS, Comic Sans, cursive",
  "Times New Roman, Times, serif",
  "Courier New, Courier, monospace",
  "Impact, Haettenschweiler, sans-serif",
  "Tahoma, Verdana, sans-serif",
];
function safeStyle(v){
  const out = [];
  const col = /(?:^|;)\s*color\s*:\s*(#[0-9a-f]{6})\s*(?:;|$)/i.exec(v || "");
  if(col) out.push("color:" + col[1].toLowerCase());
  const fam = /(?:^|;)\s*font-family\s*:\s*([^;]+)/i.exec(v || "");
  if(fam){
    const want = fam[1].trim().replace(/["']/g, "").toLowerCase();
    const hit = OK_FONTS.find(f => f.toLowerCase() === want);
    if(hit) out.push("font-family:" + hit);
  }
  return out.join(";");
}
function safeHtml(dirty){
  const doc = new DOMParser().parseFromString("<body>" + (dirty || "") + "</body>", "text/html");
  const walk = (src, dst) => {
    src.childNodes.forEach(n => {
      if(n.nodeType === 3){ dst.appendChild(document.createTextNode(n.nodeValue)); return; }
      if(n.nodeType !== 1) return;
      const tag = n.tagName.toLowerCase();
      // These carry code rather than words, so their text goes too. Everything
      // else is unwrapped: the tag disappears and what it wrapped survives.
      if(tag === "script" || tag === "style" || tag === "template") return;
      if(!OK_TAGS[tag]){ walk(n, dst); return; }      // unwrap, keep the words
      const el = document.createElement(tag);
      if(tag === "a"){
        // Read through the parser's own decoding, then insist on a real scheme.
        const href = (n.getAttribute("href") || "").trim();
        // Protocol relative, //host, is off site while looking like a path.
        // Dropped here so this agrees with lib/sanitize-html.ts, which drops it
        // on the way in. Two sanitizers that disagree is how a hole appears.
        const abs = href.startsWith("//") ? null
          : (() => { try { return new URL(href, location.origin); } catch(e){ return null; } })();
        if(abs && (abs.protocol === "http:" || abs.protocol === "https:")){
          el.setAttribute("href", abs.href);
          el.setAttribute("target", "_blank");
          el.setAttribute("rel", "noopener noreferrer");
        } else {
          walk(n, dst); return;                        // drop the link, keep the words
        }
      }
      if(tag === "span"){
        const st = safeStyle(n.getAttribute("style"));
        if(st) el.setAttribute("style", st);
      }
      walk(n, el);
      dst.appendChild(el);
    });
  };
  const out = document.createElement("div");
  walk(doc.body, out);
  return out.innerHTML;
}

function blogEntry(p){
  const d = new Date(p.posted_at);
  let h = d.getHours(); const ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12;
  const time = h + ":" + String(d.getMinutes()).padStart(2, "0") + " " + ap;
  const mood = (p.mood || "").trim(), music = (p.music || "").trim();
  const face = mood ? ICONS[mood.toLowerCase()] : null;
  return `
    <article class="xa" aria-labelledby="xt-${esc(p.id)}">
      ${p.pinned ? `<span class="xa-pin">sticky</span>` : ``}
      <h4 class="xa-t" id="xt-${esc(p.id)}">${esc(p.title || "(no title)")}</h4>
      <p class="xa-by">posted by <b>${esc(p.byline || "the cast")}</b> @ ${time}${
        p.is_audience ? ` &nbsp;·&nbsp; <span class="xa-aud">from the audience</span>` : ``}${
        CAST && p.is_audience ? ` &nbsp;·&nbsp; <button class="xa-del" data-del-post="${esc(p.id)}">delete</button>` : ``}</p>
      ${(mood || music) ? `<div class="xa-mm">
        ${mood  ? `<p><b>Current Mood:</b> ${esc(mood)}${
          face ? ` <img src="${face}" alt="">` : ``}</p>` : ``}
        ${music ? `<p><b>Current Music:</b> ${esc(music)}</p>` : ``}
      </div>` : ``}
      <div class="xa-body">${safeHtml(p.body)}</div>
    </article>`;
}

function viewBlog(){
  // Grouped by the day they were posted, which is how Xanga did it and which
  // gives the date headings for free.
  const pinned = posts.filter(p => p.pinned);
  const rest   = posts.filter(p => !p.pinned);
  const days = [];
  rest.forEach(p => {
    const key = stamp2006(p.posted_at).split(" · ")[0];
    const last = days[days.length - 1];
    if(last && last.key === key) last.items.push(p);
    else days.push({key, items: [p]});
  });

  const entries = !postsLoaded
    ? `<p class="xa-none">loading...</p>`
    : (posts.length
        ? (pinned.map(blogEntry).join("") +
           days.map(d => `<section class="xa-day" aria-label="${esc(d.key)}">
              <h3 class="xa-date">${esc(d.key)}</h3>
              ${d.items.map(blogEntry).join("")}
            </section>`).join(""))
        : `<p class="xa-none">nobody has written anything yet. give them a minute,
             they are in tech.</p>`);

  const months = [...new Set(posts.map(p => {
    const d = new Date(p.posted_at);
    return MONTHS[d.getMonth()].slice(0, 3).toLowerCase() + " 2006";
  }))];

  const body = `
    <div class="pane xanga">
      <div class="xa-nav">
        <b>the2006ers</b>: <a href="#xa-entries">weblog</a> ·
        <a href="#" data-go="wall">confessions</a> ·
        <a href="#" data-go="videos">videos</a> ·
        <a href="#" data-go="playlists">audio</a> ·

async function loadBlog(){
  const q = (cols) => sbGet(
    "production_posts?select=" + cols + ",productions!inner(slug)"
    + `&productions.slug=eq.${encodeURIComponent(CONFIG.SLUG)}`
    + "&is_published=eq.true&order=pinned.desc,posted_at.desc&limit=100");
  try {
    let rows;
    try { rows = await q("id,title,byline,body,pinned,posted_at,mood,music,is_audience"); }
    catch(e){ rows = await q("id,title,byline,body,pinned,posted_at"); }   // before v57/v59
    if(Array.isArray(rows)) posts = rows;
  } catch(e){
    console.warn("2006: could not load the blog.", e);
  }
  postsLoaded = true;
  if(screen === "blog") render();
}

function wireBlog(){
  if(!postsLoaded && !posts.length) loadBlog();
  wireModerate();
  const form = document.getElementById("essay");
  if(!form) return;
  const t = document.getElementById("es-body"), ti = document.getElementById("es-title");
  const left = document.getElementById("es-left");
  t.oninput  = () => { draftSet({esBody: t.value});  if(left) left.textContent = 6000 - t.value.length; };
  ti.oninput = () => { draftSet({esTitle: ti.value}); };
  form.onsubmit = async e => {
    e.preventDefault();
    const err = document.getElementById("es-err");
    if(!t.value.trim()){ err.textContent = "there is nothing in it yet."; say(err.textContent); t.focus(); return; }
    const btn = document.getElementById("es-post"); btn.disabled = true; btn.textContent = "posting...";
    let out = null;
    try {
      const r = await fetch("/api/2006/essay", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({title: ti.value, body: t.value, screenName: ME.sn, device: deviceTag(),
                              website: document.getElementById("es-hp").value})});
      out = await r.json();
    } catch(x){ out = {ok:false, message:"the internet did that thing. try again?"}; }
    if(!out.ok){
      btn.disabled = false; btn.textContent = "post it";
      err.textContent = out.message || "that did not go through."; say(err.textContent); return;
    }
    if(out.post) posts.unshift(out.post);
    draftSet({esBody:"", esTitle:""});
    render();
    say("posted. it is on the blog now.");
    const first = document.querySelector(".xa"); if(first){ first.setAttribute("tabindex","-1"); first.focus(); }
  };
}
