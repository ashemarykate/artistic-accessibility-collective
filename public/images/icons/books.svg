<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- drop shadow -->
  <rect x="2" y="4" width="14" height="11" fill="#808080"/>
  <!-- Top binding strip -->
  <rect x="1" y="2" width="14" height="2" fill="#804000"/>
  <!-- Left page -->
  <rect x="1" y="4" width="6" height="10" fill="#fffff0"/>
  <rect x="1" y="4" width="6" height="10" fill="none" stroke="#806020" stroke-width="0.5"/>
  <!-- Right page -->
  <rect x="9" y="4" width="6" height="10" fill="#fffff0"/>
  <rect x="9" y="4" width="6" height="10" fill="none" stroke="#806020" stroke-width="0.5"/>
  <!-- Spine -->
  <rect x="7" y="2" width="2" height="12" fill="#603000"/>
  <!-- Text lines — left page -->
  <rect x="2" y="6"  width="4" height="1" fill="#c0a840"/>
  <rect x="2" y="8"  width="4" height="1" fill="#c0a840"/>
  <rect x="2" y="10" width="4" height="1" fill="#c0a840"/>
  <rect x="2" y="12" width="3" height="1" fill="#c0a840"/>
  <!-- Text lines — right page -->
  <rect x="10" y="6"  width="4" height="1" fill="#c0a840"/>
  <rect x="10" y="8"  width="4" height="1" fill="#c0a840"/>
  <rect x="10" y="10" width="4" height="1" fill="#c0a840"/>
  <rect x="10" y="12" width="3" height="1" fill="#c0a840"/>
</svg>
