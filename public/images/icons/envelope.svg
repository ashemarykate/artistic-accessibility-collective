<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- drop shadow -->
  <rect x="2" y="5" width="14" height="10" fill="#808080"/>
  <!-- Envelope body -->
  <rect x="1" y="4" width="14" height="10" fill="#ffffff"/>
  <rect x="1" y="4" width="14" height="10" fill="none" stroke="#000080" stroke-width="1"/>
  <!-- Bottom-left triangle -->
  <polygon points="1,14 6,9 1,9" fill="#e0e0ff"/>
  <!-- Bottom-right triangle -->
  <polygon points="15,14 10,9 15,9" fill="#e0e0ff"/>
  <!-- Flap (V pointing down) -->
  <polygon points="1,4 8,10 15,4" fill="#c0c0ff"/>
  <polygon points="1,4 8,10 15,4" fill="none" stroke="#000080" stroke-width="0.5"/>
</svg>
