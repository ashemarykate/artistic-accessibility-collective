<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- drop shadow -->
  <rect x="2" y="6" width="14" height="10" fill="#808080"/>
  <!-- Camera body -->
  <rect x="1" y="5" width="14" height="10" fill="#707070"/>
  <rect x="1" y="5" width="14" height="10" fill="none" stroke="#202020" stroke-width="1"/>
  <!-- Body highlight -->
  <rect x="2" y="6" width="12" height="1" fill="#b0b0b0"/>
  <!-- Viewfinder bump -->
  <rect x="5" y="3" width="5" height="3" fill="#707070"/>
  <rect x="5" y="3" width="5" height="3" fill="none" stroke="#202020" stroke-width="1"/>
  <!-- Lens outer ring -->
  <circle cx="8" cy="10" r="3.5" fill="#202040"/>
  <circle cx="8" cy="10" r="3.5" fill="none" stroke="#101010" stroke-width="0.5"/>
  <!-- Lens inner -->
  <circle cx="8" cy="10" r="2.5" fill="#000060"/>
  <!-- Lens highlight -->
  <circle cx="6.8" cy="8.8" r="1" fill="#6060a0" opacity="0.8"/>
  <!-- Flash -->
  <rect x="12" y="6" width="2" height="2" fill="#ffffa0"/>
  <rect x="12" y="6" width="2" height="2" fill="none" stroke="#808000" stroke-width="0.5"/>
</svg>
