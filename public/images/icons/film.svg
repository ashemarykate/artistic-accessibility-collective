<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Film strip background -->
  <rect x="0" y="0" width="16" height="16" fill="#1a1a1a"/>
  <!-- Top/bottom border bands -->
  <rect x="3" y="0" width="10" height="2" fill="#404040"/>
  <rect x="3" y="14" width="10" height="2" fill="#404040"/>
  <!-- Center frame (warm film look) -->
  <rect x="3" y="3" width="10" height="10" fill="#c07000"/>
  <rect x="4" y="4" width="8" height="8" fill="#e08800"/>
  <!-- Left sprocket holes -->
  <rect x="1" y="1"  width="1" height="2" fill="#707070"/>
  <rect x="1" y="6"  width="1" height="2" fill="#707070"/>
  <rect x="1" y="11" width="1" height="2" fill="#707070"/>
  <!-- Right sprocket holes -->
  <rect x="14" y="1"  width="1" height="2" fill="#707070"/>
  <rect x="14" y="6"  width="1" height="2" fill="#707070"/>
  <rect x="14" y="11" width="1" height="2" fill="#707070"/>
  <!-- Frame border highlight -->
  <rect x="3" y="3" width="10" height="1" fill="#ff9000"/>
  <rect x="3" y="3" width="1" height="10" fill="#ff9000"/>
</svg>
