<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- drop shadow -->
  <rect x="2" y="2" width="14" height="14" fill="#808080" shape-rendering="crispEdges"/>
  <!-- Board body (lower) -->
  <rect x="1" y="6" width="14" height="9" fill="#c0c0c0" shape-rendering="crispEdges"/>
  <rect x="1" y="6" width="14" height="9" fill="none" stroke="#202020" stroke-width="1" shape-rendering="crispEdges"/>
  <!-- Board highlight -->
  <rect x="2" y="7" width="12" height="1" fill="#e0e0e0" shape-rendering="crispEdges"/>
  <!-- Board text lines -->
  <rect x="3" y="9"  width="10" height="1" fill="#808080" shape-rendering="crispEdges"/>
  <rect x="3" y="11" width="10" height="1" fill="#808080" shape-rendering="crispEdges"/>
  <rect x="3" y="13" width="7"  height="1" fill="#808080" shape-rendering="crispEdges"/>
  <!-- Hinge line -->
  <rect x="1" y="6" width="14" height="1" fill="#404040" shape-rendering="crispEdges"/>
  <!-- Clapper top: black background -->
  <rect x="1" y="1" width="14" height="5" fill="#101010" shape-rendering="crispEdges"/>
  <rect x="1" y="1" width="14" height="5" fill="none" stroke="#202020" stroke-width="1" shape-rendering="crispEdges"/>
  <!-- Diagonal white stripes clipped to clapper -->
  <clipPath id="clapper-clip">
    <rect x="1" y="1" width="14" height="5"/>
  </clipPath>
  <g clip-path="url(#clapper-clip)">
    <polygon points="-1,1 3,1 8,6 4,6"   fill="#ffffff"/>
    <polygon points="5,1 9,1  14,6 10,6"  fill="#ffffff"/>
    <polygon points="11,1 15,1 20,6 16,6" fill="#ffffff"/>
  </g>
</svg>
