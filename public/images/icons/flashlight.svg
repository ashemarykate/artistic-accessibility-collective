<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Light beam -->
  <polygon points="10,4 16,1 16,13 10,10" fill="#ffffa0"/>
  <polygon points="10,5 15,2 15,12 10,9"  fill="#ffff60"/>
  <!-- Flashlight body shadow -->
  <rect x="2" y="7" width="9" height="5" fill="#404040"/>
  <!-- Flashlight body -->
  <rect x="1" y="6" width="9" height="5" fill="#909090"/>
  <rect x="1" y="6" width="9" height="5" fill="none" stroke="#303030" stroke-width="1"/>
  <!-- Body highlight -->
  <rect x="2" y="7" width="7" height="1" fill="#c8c8c8"/>
  <!-- Head (wider section) -->
  <rect x="9" y="4" width="3" height="9" fill="#b0b0b0"/>
  <rect x="9" y="4" width="3" height="9" fill="none" stroke="#303030" stroke-width="1"/>
  <!-- Lens -->
  <rect x="11" y="6" width="1" height="5" fill="#ffff40"/>
  <!-- Button -->
  <rect x="3" y="8" width="2" height="2" fill="#ff3030"/>
  <rect x="3" y="8" width="2" height="2" fill="none" stroke="#800000" stroke-width="0.5"/>
</svg>
