<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- drop shadow -->
  <rect x="3" y="3" width="11" height="13" fill="#808080"/>
  <!-- Paper -->
  <rect x="2" y="2" width="11" height="13" fill="#ffffc0"/>
  <rect x="2" y="2" width="11" height="13" fill="none" stroke="#808000" stroke-width="1"/>
  <!-- Ruled lines -->
  <rect x="4" y="5"  width="7" height="1" fill="#c0c060"/>
  <rect x="4" y="7"  width="7" height="1" fill="#c0c060"/>
  <rect x="4" y="9"  width="7" height="1" fill="#c0c060"/>
  <rect x="4" y="11" width="5" height="1" fill="#c0c060"/>
  <!-- Spiral ring holes -->
  <rect x="1" y="3"  width="3" height="2" fill="#c0c0c0"/>
  <rect x="1" y="3"  width="3" height="2" fill="none" stroke="#808080" stroke-width="0.5"/>
  <rect x="1" y="7"  width="3" height="2" fill="#c0c0c0"/>
  <rect x="1" y="7"  width="3" height="2" fill="none" stroke="#808080" stroke-width="0.5"/>
  <rect x="1" y="11" width="3" height="2" fill="#c0c0c0"/>
  <rect x="1" y="11" width="3" height="2" fill="none" stroke="#808080" stroke-width="0.5"/>
</svg>
