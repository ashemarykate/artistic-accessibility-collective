<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Handle shadow -->
  <line x1="11" y1="11" x2="15" y2="15" stroke="#808080" stroke-width="3" stroke-linecap="round"/>
  <!-- Handle -->
  <line x1="10.5" y1="10.5" x2="14.5" y2="14.5" stroke="#808000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10.5" y1="10.5" x2="14.5" y2="14.5" stroke="#c0a000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Lens shadow -->
  <circle cx="7" cy="7" r="5.2" fill="#808080"/>
  <!-- Lens glass -->
  <circle cx="6.5" cy="6.5" r="5" fill="#c0e0ff"/>
  <circle cx="6.5" cy="6.5" r="5" fill="none" stroke="#202020" stroke-width="1.5"/>
  <!-- Inner lens -->
  <circle cx="6.5" cy="6.5" r="3.5" fill="#d8ecff"/>
  <!-- Highlight -->
  <circle cx="4.8" cy="4.8" r="1.5" fill="#ffffff" opacity="0.8"/>
</svg>
