<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A friendly robot mascot">
  <rect width="400" height="400" fill="#d8dcf5"/>
  <!-- antenna -->
  <line x1="200" y1="70" x2="200" y2="110" stroke="#263590" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="60" r="14" fill="#f5d84a" stroke="#263590" stroke-width="6"/>
  <!-- head -->
  <rect x="100" y="110" width="200" height="170" rx="34" fill="#263590" stroke="#0d1e4a" stroke-width="8"/>
  <!-- face screen -->
  <rect x="124" y="138" width="152" height="104" rx="18" fill="#0d1e4a"/>
  <!-- eyes -->
  <circle cx="165" cy="186" r="18" fill="#f5d84a"/>
  <circle cx="235" cy="186" r="18" fill="#f5d84a"/>
  <circle cx="169" cy="182" r="6" fill="#0d1e4a"/>
  <circle cx="239" cy="182" r="6" fill="#0d1e4a"/>
  <!-- happy mouth -->
  <path d="M165 214 Q200 238 235 214" fill="none" stroke="#f5d84a" stroke-width="9" stroke-linecap="round"/>
  <!-- ears / bolts -->
  <rect x="84" y="170" width="18" height="48" rx="8" fill="#263590" stroke="#0d1e4a" stroke-width="6"/>
  <rect x="298" y="170" width="18" height="48" rx="8" fill="#263590" stroke="#0d1e4a" stroke-width="6"/>
  <!-- neck + body hint -->
  <rect x="180" y="280" width="40" height="22" fill="#1a2568"/>
  <path d="M120 360 Q200 300 280 360 Z" fill="#263590" stroke="#0d1e4a" stroke-width="8"/>
</svg>
